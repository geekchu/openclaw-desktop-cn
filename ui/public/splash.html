<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        background: #0f0f0f;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        flex-direction: column;
        font-family: system-ui;
      }
      .logo {
        font-size: 72px;
        margin-bottom: 24px;
      }
      .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(255, 255, 255, 0.15);
        border-top-color: rgba(255, 255, 255, 0.8);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .text {
        color: rgba(255, 255, 255, 0.5);
        font-size: 13px;
        margin-top: 18px;
      }
    </style>
  </head>
  <body>
    <div class="logo">🦞</div>
    <div class="spinner"></div>
    <div class="text">正在启动...</div>
  </body>
</html>
